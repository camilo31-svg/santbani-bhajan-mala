<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; font-family: "Noto Sans Devanagari", "Kohinoor Devanagari", Mangal, sans-serif; }
    .cover {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 900px;
      height: 1200px;
      padding: 92px 84px 76px 106px;
      overflow: hidden;
      color: #f8f7f1;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }
    .cover::before {
      position: absolute;
      inset: 42px;
      border: 3px solid rgba(255, 255, 255, 0.56);
      content: "";
    }
    .cover::after {
      position: absolute;
      inset: 0 auto 0 0;
      width: 44px;
      background: rgba(0, 0, 0, 0.17);
      border-right: 1px solid rgba(255, 255, 255, 0.18);
      content: "";
    }
    .sr {
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.022) 0 1px, transparent 1px 8px),
        linear-gradient(145deg, #2b7b66, #124c3e 62%, #0c332a);
    }
    .sj {
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.022) 0 1px, transparent 1px 9px),
        linear-gradient(145deg, #3478bd, #194f8b 62%, #0f3158);
    }
    .cover-top,
    .cover-center,
    .cover-bottom { position: relative; z-index: 1; }
    .cover-top { display: flex; align-items: center; justify-content: space-between; color: rgba(255, 255, 255, 0.84); }
    .cover-top span { font-size: 28px; font-weight: 650; }
    .book-mark {
      display: grid;
      place-items: center;
      width: 92px;
      height: 92px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
    }
    .book-mark svg { width: 50px; height: 50px; }
    .cover-center { align-self: center; text-align: center; }
    .cover-center h1 { margin: 0; font-size: 94px; font-weight: 720; line-height: 1.24; letter-spacing: 0; text-wrap: balance; }
    .sj .cover-center h1 { font-size: 122px; line-height: 1.08; }
    .cover-center p { margin: 32px 0 0; font-family: Georgia, serif; font-size: 31px; font-style: italic; letter-spacing: 0; }
    .rule { width: 180px; height: 3px; margin: 38px auto; background: rgba(255, 255, 255, 0.72); }
    .cover-bottom { display: flex; align-items: flex-end; justify-content: space-between; color: rgba(255, 255, 255, 0.86); }
    .cover-bottom strong { font-size: 34px; font-weight: 650; }
    .cover-bottom small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 23px; }
    #app-icon { width: 512px; height: 512px; object-fit: contain; }
  </style>
</head>
<body>
  <section id="sr-cover" class="cover sr" aria-label="Carátula SR BM">
    <div class="cover-top">
      <span>सन्त साधुराम जी</span>
      <span class="book-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
        </svg>
      </span>
    </div>
    <div class="cover-center">
      <h1>किरपाल अजायब<br>सन्देश</h1>
      <div class="rule"></div>
      <p>Bhajan Mala</p>
    </div>
    <div class="cover-bottom"><strong>साधु राम</strong><small>SR BM</small></div>
  </section>

  <section id="sj-cover" class="cover sj" aria-label="Carátula SJ BM">
    <div class="cover-top">
      <span>सन्तों की वाणी</span>
      <span class="book-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
        </svg>
      </span>
    </div>
    <div class="cover-center">
      <h1>भजन<br>माला</h1>
      <div class="rule"></div>
      <p>Bayanes de los Maestros</p>
    </div>
    <div class="cover-bottom"><strong>सन्त अजायब सिंह जी</strong><small>SJ BM</small></div>
  </section>

  <img id="app-icon" src="../santbani-icon.svg" alt="Icono de libro blanco">
</body>
</html>
